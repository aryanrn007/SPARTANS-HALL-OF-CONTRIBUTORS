<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall of PRs - Spartans Community</title>
    <!-- Pixel Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-container">
        <!-- The background image is handled in CSS, but this acts as an overlay if needed -->
    </div>
    
    <header>
        <h1>HALL OF PRs</h1>
        <p class="subtitle">Your first PR is not code. It’s confidence.</p>
    </header>

    <main class="container">
        <div class="cards-grid">
            <!-- Example Card -->
            <div class="card">
                <div class="badge">
                    <div class="medal"><span class="number">1</span></div>
                    <p class="badge-text">FIRST PR</p>
                </div>

                <h2 class="name">SPARTANS</h2>
                <p class="bio">Code architect and community builder</p>
                <p class="credit">#FirstPR with SPARTANS Community</p>
                <button class="celebrate-btn" onclick="showPopup('SPARTANS')">
                  Celebrate 🎉
                </button>
            </div>
